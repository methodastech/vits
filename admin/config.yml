              - { label: "Note", name: "_note", widget: "hidden" }
              - { label: "Use scanned 3D packs", name: "useScans", widget: "boolean", default: true, hint: "On: the photoreal scanned pack shapes. Off: the code-built shapes. The artwork comes from the fields below either way." }
              - label: "Colours"
                name: "colours"
                widget: "object"
                fields:
                  - { label: "Field (yellow)", name: "field", widget: "color" }
                  - { label: "Red", name: "red", widget: "color" }
                  - { label: "Deep red", name: "redDeep", widget: "color" }
                  - { label: "Ink", name: "ink", widget: "color" }
              # A list rather than a free-text box on purpose: canvas does not
              # report an unknown font, it silently draws the default sans. A
              # typed-in face would look like the CMS was broken.
              - label: "Typeface"
                name: "fonts"
                widget: "object"
                fields:
                  - label: "Pack typeface"
                    name: "family"
                    widget: "select"
                    default: "Inter"
                    hint: "Sets every word printed on the 3D pack. The preview reloads to redraw it."
                    options:
                      - "Inter"
                      - "Archivo"
                      - "Montserrat"
                      - "Poppins"
                      - "Figtree"
                      - "Barlow Condensed"
              - { label: "Repeating seal word", name: "sealRepeat", widget: "string" }
              - label: "Ribbon claim"
                name: "claim"
                widget: "object"
                fields:
                  - { label: "English / Malay", name: "en", widget: "string" }
                  - { label: "Chinese", name: "zh", widget: "string" }
              - label: "Vit's mark"
                name: "mark"
                widget: "object"
                fields:
                  - { label: "Logo artwork", name: "image", widget: "image" }
                  - { label: "Chinese lockup", name: "chinese", widget: "string" }
              - label: "Variety (window type)"
                name: "variety"
                widget: "object"
                fields:
                  - { label: "English", name: "en", widget: "string" }
                  - { label: "Chinese", name: "zh", widget: "string" }
                  - { label: "Malay", name: "ms", widget: "string" }
              - label: "Cake count block"
                name: "count"
                widget: "object"
                fields:
                  - { label: "Prefix", name: "prefix", widget: "string" }
                  - { label: "Prefix chip", name: "prefixSmall", widget: "string" }
                  - { label: "Number", name: "number", widget: "string" }
                  - { label: "Line 1", name: "unit1", widget: "string" }
                  - { label: "Line 2", name: "unit2", widget: "string" }
                  - { label: "Line 3", name: "unit3", widget: "string" }
              - label: "Net weight"
                name: "netWeight"
                widget: "object"
                fields:
                  - { label: "Line 1", name: "line1", widget: "string" }
                  - { label: "Line 2", name: "line2", widget: "string" }
                  - { label: "Value", name: "value", widget: "string" }
              - label: "Halal mark"
                name: "halal"
                widget: "object"
                collapsed: true
                fields:
                  - { label: "Ring text", name: "ring", widget: "string" }
                  - { label: "Ring text (Arabic)", name: "ringArabic", widget: "string" }
                  - { label: "Centre (Arabic)", name: "centreArabic", widget: "string" }
                  - { label: "Centre (Latin)", name: "centreLatin", widget: "string" }
                  - { label: "Cert line 1", name: "certLine1", widget: "string" }
                  - { label: "Cert line 2", name: "certLine2", widget: "string" }
              - label: "Back panel"
                name: "back"
                widget: "object"
                collapsed: true
                fields:
                  - { label: "Heading", name: "heading", widget: "string" }
                  - { label: "Subheading", name: "subheading", widget: "string" }
                  - label: "Cooking steps"
                    name: "steps"
                    widget: "list"
                    fields:
                      - { label: "No.", name: "no", widget: "string" }
                      - { label: "English", name: "en", widget: "string" }
                      - { label: "Malay", name: "ms", widget: "string" }
                  - { label: "Ingredients heading", name: "ingredientsHeading", widget: "string" }
                  - { label: "Ingredients", name: "ingredients", widget: "text" }
                  - { label: "Manufacturer", name: "manufacturer", widget: "text" }
                  - { label: "Barcode number", name: "barcode", widget: "string" }

          - label: "Story"
            name: "story"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Kicker", name: "kicker", widget: "string" }
              - { label: "Heading line 1", name: "heading1", widget: "string" }
              - { label: "Heading line 2 (italic)", name: "heading2", widget: "string" }
              - { label: "Lede", name: "lede", widget: "text" }
              - label: "Fact tiles"
                name: "tiles"
                widget: "list"
                fields:
                  - { label: "Figure", name: "year", widget: "string" }
                  - { label: "Body", name: "body", widget: "text" }
                  - { label: "Red gate flag", name: "flag", widget: "string", required: false }
                  - { label: "Photo", name: "image", widget: "image", required: false, hint: "Shown beside this milestone on the home page journey" }
              - { label: "Foot note", name: "footNote", widget: "text" }

          - label: "Trade / OEM"
            name: "trade"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Kicker", name: "kicker", widget: "string" }
              - { label: "Heading line 1", name: "heading1", widget: "string" }
              - { label: "Heading line 2", name: "heading2", widget: "string" }
              - { label: "Heading line 3", name: "heading3", widget: "string" }
              - { label: "Lede", name: "lede", widget: "text" }
              - { label: "Carton caption", name: "cartonCaption", widget: "text" }
              - { label: "Carton images", name: "cartonImages", widget: "list", field: { label: "Image", name: "image", widget: "image" } }
              - label: "The five buyer checks"
                name: "checks"
                widget: "list"
                fields:
                  - { label: "Number", name: "no", widget: "string" }
                  - label: "Icon"
                    name: "icon"
                    widget: "select"
                    options: ["formats", "shelf", "cert", "tiers", "custom"]
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Body", name: "body", widget: "text" }
                  - { label: "Red gate flag", name: "flag", widget: "string", required: false }
              - { label: "Certification chips", name: "certChips", widget: "list", field: { label: "Chip", name: "chip", widget: "string" } }
              - label: "Button"
                name: "cta"
                widget: "object"
                fields:
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "Anchor", name: "href", widget: "string" }

          - label: "The range"
            name: "range"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Kicker", name: "kicker", widget: "string" }
              - label: "Specimens"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Eyebrow line", name: "line", widget: "string" }
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Body", name: "body", widget: "text" }
                  - { label: "Meta A label", name: "metaA", widget: "string" }
                  - { label: "Meta A value", name: "metaAValue", widget: "string" }
                  - { label: "Meta B label", name: "metaB", widget: "string" }
                  - { label: "Meta B value", name: "metaBValue", widget: "string" }
                  - { label: "Image", name: "image", widget: "image", required: false }
                  - { label: "Use the live 3D pack instead", name: "use3D", widget: "boolean", default: false }

          - label: "Footer"
            name: "footer"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Note", name: "note", widget: "string" }
              - { label: "Demo line", name: "demo", widget: "string" }
              - { label: "Model credit (CC BY — must stay)", name: "credit", widget: "string" }

