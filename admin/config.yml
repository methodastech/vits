                  - { label: "Title", name: "title", widget: "string" }
              - label: "Facts"
                name: "facts"
                widget: "list"
                fields:
                  - { label: "Figure", name: "n", widget: "string" }
                  - { label: "Caption", name: "s", widget: "string" }
              - label: "Factory"
                name: "factory"
                widget: "object"
                fields:
                  - { label: "Kicker", name: "kicker", widget: "string" }
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Body", name: "body", widget: "text" }
                  - { label: "Body 2", name: "body2", widget: "text" }
                  - { label: "Image", name: "image", widget: "image", required: false }
              - label: "Standards"
                name: "standards"
                widget: "object"
                fields:
                  - { label: "Kicker", name: "kicker", widget: "string" }
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Note", name: "note", widget: "text" }
              - label: "Call to action"
                name: "cta"
                widget: "object"
