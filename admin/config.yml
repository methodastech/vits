          - label: "Footer"
            name: "footer"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Note", name: "note", widget: "string" }
              - { label: "Demo line", name: "demo", widget: "string" }
              - { label: "Model credit (CC BY — must stay)", name: "credit", widget: "string" }

          - label: "Navigation — not on any prototype yet"
            name: "nav"
            widget: "object"
            collapsed: true
            fields:
              - label: "Links"
                name: "links"
                widget: "list"
                fields:
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "Anchor", name: "href", widget: "string" }
              - label: "Button"
                name: "cta"
                widget: "object"
                fields:
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "Anchor", name: "href", widget: "string" }

          - label: "Credentials strip — not on any prototype yet"
            name: "credentials"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - label: "Marks"
                name: "marks"
                widget: "list"
                fields:
                  - label: "Icon"
                    name: "icon"
                    widget: "select"
                    options: ["halal", "shield", "clip", "plant", "globe", "cert"]
                  - { label: "Name", name: "name", widget: "string" }
                  - { label: "Sub label", name: "sub", widget: "string" }

          - label: "The cook — not on any prototype yet"
            name: "cook"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Display line 1", name: "display1", widget: "string" }
              - { label: "Display line 2", name: "display2", widget: "string" }
              - label: "Captions"
                name: "captions"
                widget: "list"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Sub", name: "sub", widget: "string" }

          - label: "Finale / enquiry — not on any prototype yet"
            name: "finale"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Kicker", name: "kicker", widget: "string" }
              - { label: "Heading line 1", name: "heading1", widget: "string" }
              - { label: "Heading line 2 (red)", name: "heading2", widget: "string" }
              - { label: "Heading line 3", name: "heading3", widget: "string" }
              - label: "Exhibition calendar"
                name: "shows"
                widget: "list"
                fields:
                  - { label: "Date", name: "date", widget: "string" }
                  - { label: "Name", name: "name", widget: "string" }
                  - { label: "Detail", name: "detail", widget: "string" }
              - { label: "Skip the queue line", name: "skipLine", widget: "text" }
              - label: "Enquiry form"
                name: "form"
                widget: "object"
                collapsed: true
                fields:
                  - { label: "Form title", name: "title", widget: "string" }
                  - { label: "Name label", name: "nameLabel", widget: "string" }
                  - { label: "Name placeholder", name: "namePlaceholder", widget: "string" }
                  - { label: "Company label", name: "companyLabel", widget: "string" }
                  - { label: "Company placeholder", name: "companyPlaceholder", widget: "string" }
                  - { label: "Market label", name: "marketLabel", widget: "string" }
                  - { label: "Market placeholder", name: "marketPlaceholder", widget: "string" }
                  - { label: "Interest label", name: "interestLabel", widget: "string" }
                  - { label: "Interest options", name: "interestOptions", widget: "list", field: { label: "Option", name: "opt", widget: "string" } }
                  - { label: "Message label", name: "messageLabel", widget: "string" }
                  - { label: "Message placeholder", name: "messagePlaceholder", widget: "string" }
                  - { label: "Submit button", name: "submit", widget: "string" }
                  - { label: "Note under form", name: "note", widget: "text" }

      # ─────────────────────────────────────────────────────────────
      - name: "content2"
        label: "Prototype 2"
        file: "content2.json"
        description: "No 3D pack on this prototype."
        fields:

          - label: "Brand"
            name: "brand"
            widget: "object"
            collapsed: true
