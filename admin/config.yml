                  - { label: "Anchor", name: "href", widget: "string" }

          - label: "The range"
            name: "range"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Kicker", name: "kicker", widget: "string" }
              - label: "Specimens"
                name: "items"
                widget: "list"
