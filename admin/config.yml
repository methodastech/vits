# Decap CMS — git-based, no server needed.
# Edits commit straight to the repo and the host redeploys.
#
# Editors sign in with GitHub and need write access to the repo.
# (git-gateway was the original plan, but Netlify Identity is closed to new
# sites — /.netlify/identity 404s — so the github backend it is. It uses
# Netlify's OAuth gateway, which needs a one-time setup: see admin/README.md.)

backend:
  name: github
  repo: methodastech/vits
  branch: main

# Local editing: when the page is served from localhost, Decap talks to
# `npx decap-server` on :8081 and writes content.json straight to disk,
# skipping git-gateway and Netlify Identity entirely. Ignored in production.
local_backend: true

# Uploaded images land here and are referenced as assets/...
media_folder: "assets"
public_folder: "assets"

# Editors see a live preview of the running site rather than a generic form preview
site_url: /
display_url: /
logo_url: /assets/vits-logo.png

collections:
  - name: "site"
    label: "Website content"
    files:
      - name: "content"
        label: "Prototype 1"
        file: "content.json"
        description: "Full 3D scroll build. Carries the content no prototype uses yet, so it is not lost."
        fields:

          - label: "Brand"
            name: "brand"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Logo", name: "logo", widget: "image", required: false }
              - { label: "Brand name", name: "name", widget: "string" }
              - { label: "Legal entity", name: "legal", widget: "string" }
              - { label: "City", name: "city", widget: "string" }

          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Headline word 1", name: "line1a", widget: "string", hint: "Sits on its own line on Prototype 2" }
              - { label: "Headline line 1", name: "line1b", widget: "string" }
              - { label: "Headline line 2", name: "line2", widget: "string" }
              - { label: "Headline line 3", name: "line3", widget: "string", required: false }
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Lede", name: "lede", widget: "text" }
              - { label: "Scroll cue", name: "scrollCue", widget: "string" }
              - { label: "Scroll cue (long)", name: "scrollCueLong", widget: "string" }
              - label: "Stat chips"
                name: "stats"
                widget: "list"
                fields:
                  - { label: "Figure", name: "value", widget: "string" }
                  - { label: "Caption", name: "label", widget: "string" }
              - label: "Callouts"
                name: "callouts"
                widget: "list"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Body", name: "body", widget: "text" }

          # ── THE 3D PACKAGING ────────────────────────────────────────

          - label: "3D packaging artwork"
            name: "pack"
            widget: "object"
            collapsed: true
            summary: "Everything printed on the 3D pack"
            fields:
              - { label: "Note", name: "_note", widget: "hidden" }
              - label: "Colours"
                name: "colours"
                widget: "object"
                fields:
                  - { label: "Field (yellow)", name: "field", widget: "color" }
                  - { label: "Red", name: "red", widget: "color" }
                  - { label: "Deep red", name: "redDeep", widget: "color" }
                  - { label: "Ink", name: "ink", widget: "color" }
              # A list rather than a free-text box on purpose: canvas does not
              # report an unknown font, it silently draws the default sans. A
              # typed-in face would look like the CMS was broken.
              - label: "Typeface"
                name: "fonts"
                widget: "object"
                fields:
                  - label: "Pack typeface"
                    name: "family"
                    widget: "select"
                    default: "Inter"
                    hint: "Sets every word printed on the 3D pack. The preview reloads to redraw it."
                    options:
                      - "Inter"
                      - "Archivo"
                      - "Montserrat"
                      - "Poppins"
                      - "Figtree"
                      - "Barlow Condensed"
              - { label: "Repeating seal word", name: "sealRepeat", widget: "string" }
              - label: "Ribbon claim"
                name: "claim"
                widget: "object"
                fields:
                  - { label: "English / Malay", name: "en", widget: "string" }
                  - { label: "Chinese", name: "zh", widget: "string" }
              - label: "Vit's mark"
                name: "mark"
                widget: "object"
                fields:
                  - { label: "Logo artwork", name: "image", widget: "image" }
                  - { label: "Chinese lockup", name: "chinese", widget: "string" }
              - label: "Variety (window type)"
                name: "variety"
                widget: "object"
                fields:
                  - { label: "English", name: "en", widget: "string" }
                  - { label: "Chinese", name: "zh", widget: "string" }
                  - { label: "Malay", name: "ms", widget: "string" }
              - label: "Cake count block"
                name: "count"
                widget: "object"
                fields:
                  - { label: "Prefix", name: "prefix", widget: "string" }
                  - { label: "Prefix chip", name: "prefixSmall", widget: "string" }
                  - { label: "Number", name: "number", widget: "string" }
                  - { label: "Line 1", name: "unit1", widget: "string" }
                  - { label: "Line 2", name: "unit2", widget: "string" }
                  - { label: "Line 3", name: "unit3", widget: "string" }
              - label: "Net weight"
                name: "netWeight"
                widget: "object"
                fields:
                  - { label: "Line 1", name: "line1", widget: "string" }
                  - { label: "Line 2", name: "line2", widget: "string" }
                  - { label: "Value", name: "value", widget: "string" }
              - label: "Halal mark"
                name: "halal"
                widget: "object"
                collapsed: true
                fields:
                  - { label: "Ring text", name: "ring", widget: "string" }
                  - { label: "Ring text (Arabic)", name: "ringArabic", widget: "string" }
                  - { label: "Centre (Arabic)", name: "centreArabic", widget: "string" }
                  - { label: "Centre (Latin)", name: "centreLatin", widget: "string" }
                  - { label: "Cert line 1", name: "certLine1", widget: "string" }
                  - { label: "Cert line 2", name: "certLine2", widget: "string" }
              - label: "Back panel"
                name: "back"
                widget: "object"
                collapsed: true
                fields:
                  - { label: "Heading", name: "heading", widget: "string" }
                  - { label: "Subheading", name: "subheading", widget: "string" }
                  - label: "Cooking steps"
                    name: "steps"
                    widget: "list"
                    fields:
                      - { label: "No.", name: "no", widget: "string" }
                      - { label: "English", name: "en", widget: "string" }
                      - { label: "Malay", name: "ms", widget: "string" }
                  - { label: "Ingredients heading", name: "ingredientsHeading", widget: "string" }
                  - { label: "Ingredients", name: "ingredients", widget: "text" }
                  - { label: "Manufacturer", name: "manufacturer", widget: "text" }
                  - { label: "Barcode number", name: "barcode", widget: "string" }

          - label: "Story"
            name: "story"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Kicker", name: "kicker", widget: "string" }
              - { label: "Heading line 1", name: "heading1", widget: "string" }
              - { label: "Heading line 2 (italic)", name: "heading2", widget: "string" }
              - { label: "Lede", name: "lede", widget: "text" }
              - label: "Fact tiles"
                name: "tiles"
                widget: "list"
                fields:
                  - { label: "Figure", name: "year", widget: "string" }
                  - { label: "Body", name: "body", widget: "text" }
                  - { label: "Red gate flag", name: "flag", widget: "string", required: false }
                  - { label: "Photo", name: "image", widget: "image", required: false, hint: "Shown beside this milestone on the home page journey" }
              - { label: "Foot note", name: "footNote", widget: "text" }

          - label: "Trade / OEM"
            name: "trade"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Kicker", name: "kicker", widget: "string" }
              - { label: "Heading line 1", name: "heading1", widget: "string" }
              - { label: "Heading line 2", name: "heading2", widget: "string" }
              - { label: "Heading line 3", name: "heading3", widget: "string" }
              - { label: "Lede", name: "lede", widget: "text" }
              - { label: "Carton caption", name: "cartonCaption", widget: "text" }
              - { label: "Carton images", name: "cartonImages", widget: "list", field: { label: "Image", name: "image", widget: "image" } }
              - label: "The five buyer checks"
                name: "checks"
                widget: "list"
                fields:
                  - { label: "Number", name: "no", widget: "string" }
                  - label: "Icon"
                    name: "icon"
                    widget: "select"
                    options: ["formats", "shelf", "cert", "tiers", "custom"]
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Body", name: "body", widget: "text" }
                  - { label: "Red gate flag", name: "flag", widget: "string", required: false }
              - { label: "Certification chips", name: "certChips", widget: "list", field: { label: "Chip", name: "chip", widget: "string" } }
              - label: "Button"
                name: "cta"
                widget: "object"
                fields:
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "Anchor", name: "href", widget: "string" }

          - label: "The range"
            name: "range"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Kicker", name: "kicker", widget: "string" }
              - label: "Specimens"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Eyebrow line", name: "line", widget: "string" }
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Body", name: "body", widget: "text" }
                  - { label: "Meta A label", name: "metaA", widget: "string" }
                  - { label: "Meta A value", name: "metaAValue", widget: "string" }
                  - { label: "Meta B label", name: "metaB", widget: "string" }
                  - { label: "Meta B value", name: "metaBValue", widget: "string" }
                  - { label: "Image", name: "image", widget: "image", required: false }
                  - { label: "Use the live 3D pack instead", name: "use3D", widget: "boolean", default: false }

          # Scene 6 on Prototype 1. Had no fields at all, which meant Decap
          # deleted this block from content.json on every save.
          - label: "Bowl reel"
            name: "reel"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Note", name: "_note", widget: "hidden" }
              - { label: "Kicker", name: "kicker", widget: "string" }
              - { label: "Title", name: "title", widget: "string", hint: "Inline <br> and <em> are allowed here" }
