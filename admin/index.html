<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Vit's Noodles · Content</title>
</head>
<body>
<script src="https://unpkg.com/decap-cms@^3.3.3/dist/decap-cms.js"></script>
<script>
/* ============================================================
   Live preview.
   The default preview lists every field top to bottom, which tells an
   editor nothing about where their words land. Instead we render the
   real site in an iframe and post the draft into it on each keystroke;
   content.js applies it through the same data-c bindings the live page
   uses, so the preview IS the page. The field the editor just touched
   is scrolled to and ringed, so there is never a hunt for the text.
   ============================================================ */
(function () {
  var h = window.h || (window.React && window.React.createElement);
  if (!window.CMS || !h) return;

  function component(spec) {
    if (window.createClass) return window.createClass(spec);
    var R = window.React;
    var C = function (props) { R.Component.call(this, props); };
    C.prototype = Object.create(R.Component.prototype);
    C.prototype.constructor = C;
    Object.keys(spec).forEach(function (k) { C.prototype[k] = spec[k]; });
    return C;
  }

  /* Dotted path of the first field that differs — the one being edited. */
  function firstChange(a, b, prefix) {
    if (a === b) return null;
    if (a == null || b == null || typeof a !== 'object' || typeof b !== 'object') {
      return prefix || null;
    }
    var keys = Object.keys(b);
    for (var i = 0; i < keys.length; i++) {
      var p = prefix ? prefix + '.' + keys[i] : keys[i];
      var hit = firstChange(a[keys[i]], b[keys[i]], p);
      if (hit) return hit;
    }
    return null;
  }

  /* The three prototypes all read this one content.json. */
  var PROTOS = [
    { label: 'Prototype 1', src: '/index.html' },
    { label: 'Prototype 2', src: '/index2.html' },
    { label: 'Prototype 3', src: '/index3.html' }
  ];
  var PROTO_KEY = 'vits:previewPrototype';

  var Preview = component({
    componentDidMount: function () { this.sync(); },
    componentDidUpdate: function () { this.sync(); },

    sync: function () {
      var self = this;
      var win = this.frame && this.frame.contentWindow;
      if (!win || !this.ready) return;
      var data = this.props.entry.get('data').toJS();
      win.postMessage({ type: 'vits:preview', data: data }, window.location.origin);
      /* No previous snapshot means this is the first paint, not an edit. */
      var changed = this.last ? firstChange(this.last, data) : null;
      this.last = data;
      if (!changed) return;

      /* Page copy repaints from the message. The 3D pack cannot: it bakes its
         colours, typeface and printed words into canvas textures once at
         startup. So a pack edit needs a genuine reload — debounced, or every
         keystroke in a pack field would restart the whole scene. */
      if (changed.indexOf('pack.') === 0) {
        clearTimeout(this.packTimer);
        this.packTimer = setTimeout(function () {
          if (self.frame) { self.ready = false; self.frame.contentWindow.location.reload(); }
        }, 700);
        return;
      }
      win.postMessage({ type: 'vits:reveal', path: changed }, window.location.origin);
    },

    /* One content.json drives all three prototypes, so the editor needs to see
       their words land in whichever one is being shown. The choice is kept in
       localStorage rather than the entry, because it is a view preference and
       has no business in the client's content file. */
    pick: function (i) {
      if (i === this.proto) return;
      this.proto = i;
      this.ready = false;      /* block posts until the new page has loaded */
      this.last = null;        /* a switch is not an edit; do not ring anything */
      try { localStorage.setItem(PROTO_KEY, String(i)); } catch (e) {}
      this.forceUpdate();
    },

    render: function () {
      var self = this;
      if (this.proto == null) {
        var saved = 0;
        try { saved = parseInt(localStorage.getItem(PROTO_KEY), 10) || 0; } catch (e) {}
        this.proto = (saved >= 0 && saved < PROTOS.length) ? saved : 0;
      }

      var tabs = PROTOS.map(function (p, i) {
        var on = i === self.proto;
        return h('button', {
          key: p.src,
          type: 'button',
          onClick: function () { self.pick(i); },
          style: {
            font: '600 12px/1 system-ui,sans-serif', letterSpacing: '.02em',
            padding: '7px 13px', marginRight: 6, cursor: 'pointer',
            borderRadius: 999, border: '1px solid ' + (on ? '#E30613' : '#d6cec2'),
            background: on ? '#E30613' : '#fff', color: on ? '#fff' : '#5A4F45'
          }
        }, p.label);
      });

      return h('div', { style: { display: 'flex', flexDirection: 'column', height: '100vh' } }, [
        h('div', {
          key: 'bar',
          style: {
            flex: '0 0 auto', padding: '9px 12px', background: '#FBF3E2',
            borderBottom: '1px solid #e6dcc9', whiteSpace: 'nowrap',
            overflowX: 'auto'
          }
        }, tabs),
        h('iframe', {
          key: 'frame',
          src: PROTOS[this.proto].src,
          title: 'Live preview',
          ref: function (el) { self.frame = el; },
          onLoad: function () { self.ready = true; self.last = null; self.sync(); },
          style: { flex: '1 1 auto', width: '100%', border: 0, background: '#fff' }
        })
      ]);
    }
  });

  /* The pane is the whole viewport for the iframe; strip the default padding. */
  CMS.registerPreviewStyle('html,body{margin:0;padding:0;overflow:hidden}', { raw: true });
  CMS.registerPreviewTemplate('content', Preview);
})();
</script>
<script>
/* Netlify Identity: catch the invite/recovery token and open the login dialog,
   then hand off to the CMS once the user is confirmed. */
if (window.netlifyIdentity) {
  window.netlifyIdentity.on('init', function (user) {
    if (!user) {
      window.netlifyIdentity.on('login', function () { document.location.href = '/admin/'; });
    }
  });
}
</script>
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</body>
</html>
